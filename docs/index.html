<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ghi giờ làm thêm, tính tổng theo tuần/tháng và cảnh báo khi vượt 28 giờ/tuần.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arubaito">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F0F0F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sổ giờ Arubaito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 30rem column on a soft grey canvas. White cards with large radii, charcoal as the only "accent" (selected pills, primary buttons,
   floating tab bar); colour comes from the illustrated hero, whose sky turns gold then red as the week fills up. Red is kept for the over-limit alarm. */
:root{
  --bg:#F0F0F1; --card:#FFFFFF; --fill:#F4F4F5; --fill-2:#E8E8EA;
  --ink:#1C1D1F; --ink-2:#86878C; --ink-3:#B6B7BB; --line:rgb(0 0 0 / .07);
  --pri:#232427; --on-pri:#FFFFFF; --tabbar:#232427; --tab-on:#FFFFFF; --tab-on-ink:#232427;
  --red:#E5483B; --red-ink:#C2362A; --red-soft:#FCEBE8;
  --amber:#E9A23B; --amber-ink:#97620F; --amber-soft:#FBF1DF;
  --green:#2F9E62; --green-ink:#22804D; --green-soft:#E4F3EA;
  --scrim:rgb(0 0 0 / .32); --shadow:0 1px 2px rgb(0 0 0 / .03),0 10px 28px rgb(0 0 0 / .05);
  --f:"Onest", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --r-xl:30px; --r-l:24px; --r-m:18px;
  --tab-gap:max(12px, calc(env(safe-area-inset-bottom, 0px) - 12px));
}
/* CJK text falls back past Onest to a system font of the right script */
html[lang="ja"]{--f:"Onest", -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif}
html[lang="zh"]{--f:"Onest", -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif}
html[lang="ko"]{--f:"Onest", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0F; --card:#1B1C1E; --fill:#26272A; --fill-2:#323337;
    --ink:#F3F3F4; --ink-2:#9C9DA2; --ink-3:#5F6065; --line:rgb(255 255 255 / .08);
    --pri:#F3F3F4; --on-pri:#151618; --tabbar:#2A2B2E; --tab-on:#F3F3F4; --tab-on-ink:#151618;
    --red:#FF5A4D; --red-ink:#FF7D72; --red-soft:#3A1916;
    --amber:#F2B24B; --amber-ink:#F2B24B; --amber-soft:#33280F;
    --green:#45C482; --green-ink:#45C482; --green-soft:#12291D;
    --scrim:rgb(0 0 0 / .6); --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0F; --card:#1B1C1E; --fill:#26272A; --fill-2:#323337;
  --ink:#F3F3F4; --ink-2:#9C9DA2; --ink-3:#5F6065; --line:rgb(255 255 255 / .08);
  --pri:#F3F3F4; --on-pri:#151618; --tabbar:#2A2B2E; --tab-on:#F3F3F4; --tab-on-ink:#151618;
  --red:#FF5A4D; --red-ink:#FF7D72; --red-soft:#3A1916;
  --amber:#F2B24B; --amber-ink:#F2B24B; --amber-soft:#33280F;
  --green:#45C482; --green-ink:#45C482; --green-soft:#12291D;
  --scrim:rgb(0 0 0 / .6); --shadow:none;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-bottom:120px}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit;margin:0}
h1,h2,h3,p,ul,ol{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{flex:none}
.wrap{width:100%;max-width:30rem;margin-inline:auto;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:14px 28px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.ja{font-weight:400;font-size:.82em;color:var(--ink-3)}
html[lang="ja"] .ja{display:none} /* the Japanese hint would just repeat the label */
.muted{color:var(--ink-2)}
.t{font-variant-numeric:tabular-nums}
.press:active,.pill:active,.circle:active,.day:active,.tab:active,.cta:active,.chip:active{transform:scale(.96)}
.press,.pill,.circle,.day,.tab,.cta,.chip{transition:transform .12s ease}

/* ---------- headers ---------- */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.head h1{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.head p{font-size:15px;color:var(--ink-2);margin-top:2px}
.head-c{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:8px;padding-top:4px}
.head-c .title{text-align:center;min-width:0}
.head-c .title b{display:block;font-size:21px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-c .title small{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.circle svg{width:21px;height:21px}
.circle.dark{background:var(--pri);color:var(--on-pri);box-shadow:none}
.circle.sm{width:36px;height:36px}
.circle.sm svg{width:17px;height:17px}

/* search-bar style week switcher */
.bar{display:flex;align-items:center;gap:10px}
.switcher{flex:1;min-width:0;display:flex;align-items:center;gap:4px;height:56px;padding:0 6px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.switcher button.arrow{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.switcher button.arrow svg{width:19px;height:19px}
.switcher .lbl-c{flex:1;min-width:0;text-align:center;line-height:1.2}
.switcher .lbl-c b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap}
.switcher .lbl-c small{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar .circle.dark{width:56px;height:56px}
.bar .circle.dark svg{width:24px;height:24px}

/* ---------- section titles ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.sec h2{font-size:21px;font-weight:600;letter-spacing:-.025em}
.sec h2 span{color:var(--ink-3);font-weight:500}
.ulink{font-size:15px;font-weight:500;color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;white-space:nowrap}

/* ---------- pills ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;height:46px;padding:0 20px;border-radius:999px;background:var(--card);color:var(--ink-2);font-size:15.5px;font-weight:500;white-space:nowrap}
.pill.on{background:var(--pri);color:var(--on-pri)}
.pill svg{width:16px;height:16px}

/* ---------- week day pills ---------- */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:82px;border-radius:999px;background:var(--card);text-align:center}
.day small{font-size:12px;font-weight:500;color:var(--ink-2)}
.day b{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.day em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.day.has em{color:var(--ink)}
.day.over em{color:var(--red)}
.day.hol small{color:var(--red-ink)}
.day.today{background:var(--pri);color:var(--on-pri)}
.day.today small,.day.today em{color:var(--on-pri);opacity:.75}

/* ---------- illustrated hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);min-height:390px;color:#FFFFFF;isolation:isolate;
  --sky-1:#7FB0BC;--sky-2:#B9D3D1;--sky-3:#F0D6B4;--sun:#FFF5DE;--mt-1:#7184A6;--mt-2:#39445E;--snow:#F7F5F1;--hill-1:#44534A;--hill-2:#26302B}
.hero.near{--sky-1:#E59A52;--sky-2:#F2C88A;--sky-3:#FAE3BE;--sun:#FFF0C8;--mt-1:#8E5E4D;--mt-2:#4A3330;--snow:#FBEFE3;--hill-1:#5A4636;--hill-2:#33281F}
.hero.over{--sky-1:#B93A33;--sky-2:#E5694B;--sky-3:#F4A877;--sun:#FFD7A3;--mt-1:#5E2C2A;--mt-2:#2B1414;--snow:#F6D9CF;--hill-1:#3A1D1B;--hill-2:#1F0E0D}
.hero .art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero-in{position:absolute;inset:0;text-shadow:0 1px 14px rgb(0 0 0 / .28);display:flex;flex-direction:column;justify-content:space-between;padding:16px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.glass{background:rgb(255 255 255 / .2);text-shadow:0 1px 3px rgb(0 0 0 / .3);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgb(255 255 255 / .28)}
.glass-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap}
.glass-circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.glass-circle svg{width:20px;height:20px}
.hero-bottom{display:flex;flex-direction:column;gap:6px;padding:4px 4px 0}
.hero-bottom > small{font-size:14px;opacity:.85}
.hero-num{display:flex;align-items:baseline;gap:8px}
.hero-num b{font-size:clamp(48px,14.5vw,60px);font-weight:600;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.hero-num span{font-size:20px;font-weight:500;opacity:.8}
.hero-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.o-chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;border:1px solid rgb(255 255 255 / .55);font-size:13px;font-weight:600}
.o-chip svg{width:14px;height:14px}
.hero.over .o-chip{background:#FFFFFF;color:#B93A33;border-color:#FFFFFF}
.thin{height:5px;border-radius:999px;background:rgb(255 255 255 / .28);overflow:hidden;display:flex;margin:6px 0 4px}
.thin i{display:block;height:100%;background:#FFFFFF;border-radius:999px}
.thin u{display:block;height:100%;margin-left:2px;background:repeating-linear-gradient(135deg,#FFFFFF 0 3px,transparent 3px 6px)}
.cta-glass{display:flex;align-items:center;gap:10px;height:62px;padding:0 7px 0 24px;border-radius:999px;margin-top:8px;width:100%;color:#FFFFFF;font-size:16px;font-weight:500}
.cta-glass span:first-child{flex:1;text-align:center;padding-left:40px}
.cta-glass .cta-dot{text-shadow:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;color:#1C1D1F}
.cta-glass .cta-dot svg{width:20px;height:20px}

/* ---------- cards ---------- */
.card{padding:18px;border-radius:var(--r-l);background:var(--card);box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-bottom:14px}
.card-h h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
.card-h small{font-size:13px;color:var(--ink-2)}
.sum-card{display:flex;flex-direction:column;gap:10px}
.sum-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink-2);font-size:14.5px}
.badge{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.badge svg{width:14px;height:14px}
.badge.ok{background:var(--green-soft);color:var(--green-ink)}
.badge.near{background:var(--amber-soft);color:var(--amber-ink)}
.badge.over{background:var(--red);color:#FFFFFF}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:clamp(44px,13vw,54px);font-weight:600;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:19px;font-weight:500;color:var(--ink-2)}
.meter{display:flex;height:10px;border-radius:999px;background:var(--fill-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--pri)}
.meter.near i{background:var(--amber)}
.meter.over i{background:var(--red);border-radius:999px 0 0 999px}
.meter u{display:block;height:100%;margin-left:2px;background:repeating-linear-gradient(135deg,var(--red) 0 3px,transparent 3px 6px)}
.foot{font-size:14.5px;color:var(--ink-2)}

/* alerts */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:16px;border-radius:var(--r-l);background:var(--red-soft)}
.alert-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#FFFFFF}
.alert-ico svg{width:20px;height:20px}
.alert h3{font-size:16px;font-weight:600;line-height:1.3;color:var(--red-ink);text-wrap:balance}
.alert p,.alert li{font-size:14.5px;margin-top:4px}
.alert ul{padding-left:18px;margin-top:2px}
.alert .cta{margin-top:12px}
.alert.note{background:var(--card);box-shadow:var(--shadow)}
.alert.note .alert-ico{background:var(--fill);color:var(--ink)}
.alert.note h3{color:var(--ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r-l);background:var(--card);box-shadow:var(--shadow);min-width:0}
.tile-ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink);margin-bottom:8px}
.tile-ico svg{width:18px;height:18px}
.tile b{font-size:clamp(16px,5.2vw,21px);font-weight:600;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles.two .tile b{font-size:21px}
.tile small{font-size:12.5px;line-height:1.3;color:var(--ink-2)}
.tile.good b{color:var(--green-ink)} .tile.bad b{color:var(--red-ink)}

/* next shift + shift cards */
.thumb{width:62px;height:62px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--fill);flex:none;line-height:1}
.thumb b{font-size:23px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.thumb small{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-top:4px}
.next{display:flex;flex-direction:column;gap:14px;width:100%;padding:12px 12px 14px;border-radius:var(--r-xl);background:var(--card);box-shadow:var(--shadow);text-align:left}
.next-top{display:flex;align-items:center;gap:14px;padding:6px 6px 0}
.next-top .thumb{width:72px;height:72px;border-radius:20px;background:var(--pri);color:var(--on-pri)}
.next-top .thumb small{color:var(--on-pri);opacity:.7}
.next-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.next-main small{font-size:13px;color:var(--ink-2)}
.next-main b{font-size:19px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next-main span{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.next-foot{display:flex;align-items:center;gap:8px;padding:0 4px 0 6px}
.next-foot .chips-s{flex:1;min-width:0}
.chips-s{display:flex;flex-wrap:wrap;gap:6px}
.chip-s{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip-s svg{width:14px;height:14px;color:var(--ink-2)}
.next-top.press{width:100%;text-align:left}
.next-top .go{margin-left:auto}
.punch{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--r-l);background:var(--fill)}
.punch-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.punch-big{display:flex;align-items:baseline;gap:6px}
.punch-big b{font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.punch-big span{font-size:14px;color:var(--ink-2)}
.punch-st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green-ink);white-space:nowrap}
.punch-st.brk{color:var(--amber-ink)}
.punch-st i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
.punch-f{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.punch-f.warn{color:var(--amber-ink);font-weight:500}
.punch .cta{min-height:54px;font-size:16px}
.tag.ok{background:var(--green-soft);color:var(--green-ink)}
.tag.live{background:var(--amber-soft);color:var(--amber-ink)}
@keyframes pulse{50%{opacity:.35}}
.go{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--pri);color:var(--on-pri);flex:none}
.go svg{width:20px;height:20px}

.swipe{position:relative;border-radius:var(--r-l);overflow:hidden}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:120px;padding-left:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:var(--red);color:#FFFFFF;font-size:12px;font-weight:600;opacity:0}
.swipe-del svg{width:22px;height:22px}
.swipe.reveal .swipe-del{opacity:1}
.shift{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 12px;border-radius:var(--r-l);background:var(--card);box-shadow:var(--shadow);
  text-align:left;touch-action:pan-y;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.shift.over{background:var(--red-soft);box-shadow:none}
.shift.over .thumb{background:var(--red);color:#FFFFFF}
.shift.over .thumb small{color:#FFFFFF;opacity:.8}
.shift-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.shift-main small{font-size:12.5px;color:var(--ink-2)}
.shift-shop{display:flex;align-items:center;gap:7px;font-size:16.5px;font-weight:600;letter-spacing:-.01em;min-width:0}
.shift-shop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.shift-time{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.shift-dur{font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.shift.over .shift-dur{color:var(--red-ink)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--ink-2);white-space:nowrap;margin-right:4px}
.tag.red{background:var(--red);color:#FFFFFF}
.tag.dark{background:var(--pri);color:var(--on-pri)}
.tag.hol{background:var(--red-soft);color:var(--red-ink)}
.shift.over .tag:not(.red){background:var(--card)}
.empty-line{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:18px;border-radius:var(--r-l);background:var(--card);box-shadow:var(--shadow);color:var(--ink-2);font-size:15px}

/* lists */
.list{border-radius:var(--r-l);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.li{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 16px;text-align:left}
.li + .li::before{content:"";position:absolute;top:0;left:64px;right:16px;border-top:1px solid var(--line)}
.li-ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink);flex:none}
.li-ico svg{width:18px;height:18px}
.li-ico.red{background:var(--red-soft);color:var(--red-ink)}
.li-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li-main b{font-size:16px;font-weight:500}
.li-main small{font-size:13px;color:var(--ink-2)}
.li-end{display:flex;align-items:center;gap:6px;color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}
.li-end svg{width:17px;height:17px;color:var(--ink-3)}
.li.danger b{color:var(--red-ink)}
.list-h{font-size:14px;font-weight:500;color:var(--ink-2);padding-inline:6px;margin-top:10px}
.list-f{font-size:13px;line-height:1.45;color:var(--ink-2);padding-inline:6px}
.avatar{--c:#8E8E93;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#FFFFFF;font-size:19px;font-weight:600;flex:none}
.avatar.sm{width:36px;height:36px;font-size:14px}
.avatar.lg{width:56px;height:56px;font-size:22px}
.avatar.xl{width:84px;height:84px;font-size:34px;margin-inline:auto}

/* segmented pill switch */
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card)}
.seg button{flex:1;min-height:38px;padding:0 10px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--ink-2);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--pri);color:var(--on-pri)}
.list .seg,.group .seg{background:var(--fill)}
.group .seg{background:var(--card)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.3fr);gap:4px}
.cal-h{font-size:11.5px;font-weight:500;color:var(--ink-2);text-align:center;padding-bottom:3px}
.cell{position:relative;min-height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;background:var(--fill);font-variant-numeric:tabular-nums}
.cell::before{content:"";position:absolute;inset:0;background:var(--pri);opacity:calc(var(--k,0) * .9)}
.cell>*{position:relative}
.cell.dk{color:var(--on-pri)}
.cell.dk .h{color:var(--on-pri);opacity:.75}
.cell .d{font-size:14px;font-weight:600;line-height:1}
.cell .h{font-size:10px;font-weight:500;color:var(--ink-2);line-height:1}
.cell.out{opacity:.35}
.cell.hol .d{color:var(--red-ink)}
.cell.dk.hol .d{color:#FFB4AB}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.wk-over{box-shadow:inset 0 -3px 0 var(--red)}
.cell.today.wk-over{box-shadow:inset 0 0 0 2px var(--ink),inset 0 -4px 0 var(--red)}
.sum{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;border:1px solid var(--line);font-size:12px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.sum small{font-size:9.5px;font-weight:500;color:var(--ink-2)}
.sum.over{background:var(--red);border-color:var(--red);color:#FFFFFF} .sum.over small{color:#FFFFFF}
.sum.near{color:var(--amber-ink);border-color:var(--amber)}

/* pay */
.pay-hero{display:flex;flex-direction:column;gap:4px;padding:22px 20px 20px;border-radius:var(--r-xl);background:var(--pri);color:var(--on-pri)}
.pay-hero .k{font-size:14.5px;opacity:.7}
.pay-big{font-size:clamp(42px,13vw,56px);font-weight:600;letter-spacing:-.045em;line-height:1.05;font-variant-numeric:tabular-nums}
.pay-hero .s{font-size:14.5px;opacity:.7}
.pay-dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pay-dates span{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;border:1px solid currentColor;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;opacity:.9}
.acc{border-radius:var(--r-l);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.acc-head{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px 12px 12px;text-align:left}
.acc-main{flex:1;min-width:0;display:flex;flex-direction:column}
.acc-main small{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-main b{font-size:16.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-amt{font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.acc-chev{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:transform .25s}
.acc-chev svg{width:18px;height:18px}
.acc.open .acc-chev{transform:rotate(180deg)}
.acc-body{display:flex;flex-direction:column;gap:12px;margin:0 12px 12px;padding:14px 16px;border-radius:var(--r-m);background:var(--fill)}
.acc-body .k{font-size:13px;color:var(--ink-2)}
.acc-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px}
.acc-row span{font-variant-numeric:tabular-nums}
.acc-row b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* shops */
.shop{display:flex;flex-direction:column;gap:16px;padding:18px;border-radius:var(--r-xl);background:var(--card);box-shadow:var(--shadow)}
.shop-head{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.shop-name{flex:1;min-width:0;display:flex;flex-direction:column}
.shop-name b{font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
.shop-name small{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--ink-2);min-width:0}
.shop-name small svg{width:15px;height:15px}
.shop-name small span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.shop-links{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:var(--r-m);background:var(--fill);min-width:0}
.fact small{font-size:12px;color:var(--ink-2)}
.fact b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.info{display:flex;flex-direction:column;gap:6px}
.info p{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.info svg{width:16px;height:16px;margin-top:2px;color:var(--ink-3)}
.presets{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px;scroll-snap-type:x mandatory}
.presets::-webkit-scrollbar{display:none}
.pcard{flex:none;width:172px;scroll-snap-align:start;display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:var(--r-m);background:var(--fill);text-align:left;position:relative}
.pcard b{font-size:16px;font-weight:600;padding-right:4px}
.pcard .pt{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.pcard small{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-right:50px}
.pcard .go{position:absolute;right:10px;bottom:10px;width:40px;height:40px}
.pcard .go svg{width:17px;height:17px}
.pcard{min-height:112px}

/* buttons, chips */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-weight:500;font-size:15px;white-space:nowrap}
.cta svg{width:18px;height:18px}
.cta.sm{min-height:38px;padding:0 15px;font-size:14px}
.cta.dark{background:var(--pri);color:var(--on-pri)}
.cta.light{background:var(--fill);color:var(--ink)}
.cta.white{background:var(--card);color:var(--ink)}
.cta.red{background:var(--red);color:#FFFFFF}
.cta.block{width:100%;min-height:58px;font-size:16.5px}
.btn-row{display:flex;gap:8px}
.btn-row .cta{flex:1 1 0;min-width:0;padding:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;height:42px;padding:0 16px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:500;color:var(--ink)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--pri);color:var(--on-pri)}
.chip.dashed{background:none;box-shadow:inset 0 0 0 1.5px var(--ink-3);color:var(--ink)}
.chip .t{opacity:.7}
.group .chip:not(.on){background:var(--card)}
.link-btn{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:4px 2px}
.swatch{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--card)}
.swatch.on{outline:2.5px solid var(--ink);outline-offset:1px}

/* ---------- floating tab bar ---------- */
.tabfade{position:fixed;left:0;right:0;bottom:0;z-index:29;height:calc(var(--tab-gap) + 110px);pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 62%)}
.tabbar{position:fixed;z-index:30;left:50%;bottom:var(--tab-gap);transform:translateX(-50%);width:min(calc(100% - 32px),420px);
  height:74px;padding:0 9px;border-radius:999px;background:var(--tabbar);display:flex;align-items:center;justify-content:space-between;box-shadow:0 16px 34px rgb(0 0 0 / .22)}
.tab{position:relative;display:flex;align-items:center;justify-content:center;height:56px;min-width:56px;padding:0 15.5px;border-radius:999px;
  color:rgb(255 255 255 / .72);transition:background .25s ease,color .25s ease,padding .25s ease}
.tab .ti{position:relative;display:grid}
.tab svg{width:25px;height:25px}
.tl{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:15.5px;font-weight:600;transition:max-width .3s cubic-bezier(.2,.8,.2,1),opacity .2s ease,margin .3s ease}
.tab.on{background:var(--tab-on);color:var(--tab-on-ink);padding:0 22px 0 18px}
.tab.on .tl{max-width:110px;opacity:1;margin-left:9px}
.tab.badged .ti::after{content:"";position:absolute;top:-3px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--tabbar)}
.tab.on.badged .ti::after{box-shadow:0 0 0 2px var(--tab-on)}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim);animation:fade .25s ease}
.sheet-panel{position:relative;display:flex;flex-direction:column;width:100%;max-width:30rem;max-height:calc(100% - 14px - env(safe-area-inset-top,0px));
  background:var(--card);border-radius:32px 32px 0 0;animation:up .32s cubic-bezier(.2,.8,.2,1)}
#sheet-body{display:flex;flex-direction:column;flex:1;min-height:0}
.grabber{width:44px;height:5px;border-radius:3px;background:var(--fill-2);margin:9px auto 0;flex:none}
.sheet-head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:8px 16px 6px;flex:none}
.sheet-head .title{text-align:center;min-width:0}
.sheet-head .title b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .title small{font-size:13.5px;color:var(--ink-2)}
.sheet-head .circle{width:44px;height:44px;background:var(--fill);box-shadow:none}
.sheet-head .circle svg{width:18px;height:18px}
.sheet-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:22px;padding:12px 16px 20px}
.sheet-scroll > *{flex-shrink:0} /* long forms scroll instead of squashing their groups to zero height */
.sheet-foot{flex:none;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -1px 0 var(--line)}
.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{font-size:17px;font-weight:600;letter-spacing:-.015em;padding-inline:4px}
.sect-f{font-size:13px;line-height:1.45;color:var(--ink-2);padding-inline:4px}
.group{border-radius:22px;background:var(--fill);overflow:hidden}
.g-row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 16px;font-size:16px;text-align:left}
.g-row + .g-row::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1px solid var(--line)}
.g-row > span:first-child{flex:1;min-width:0}
.g-row.col{flex-direction:column;align-items:stretch;gap:10px;padding-block:14px}
.g-row.center{justify-content:center;gap:8px;font-weight:500}
.g-row.center svg{width:19px;height:19px}
.g-row.danger{color:var(--red-ink)}
.sheet .tile,.sheet .shift:not(.over),.sheet .empty-line{background:var(--fill);box-shadow:none}
.sheet .shift:not(.over) .thumb{background:var(--card)}
.in-r{flex:1;min-width:0;width:100%;border:0;background:none;padding:0;text-align:right;font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.in-l{flex:1;min-width:0;border:0;background:none;padding:0;font-size:16px;font-weight:600;color:var(--ink);outline:none}
.in-r::placeholder,.in-l::placeholder{color:var(--ink-3);font-weight:400}
.in-pill{min-height:38px;padding:6px 12px;border:0;border-radius:12px;background:var(--card);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.in-pill:focus{outline:2px solid var(--ink);outline-offset:0}
input[type=date].in-pill{min-width:142px} input[type=time].in-pill{min-width:94px}
.list .in-pill{background:var(--fill);width:72px;text-align:right}
.in-unit{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex:1;min-width:0}
.in-unit em{font-style:normal;color:var(--ink-2)}
select.in-r{text-align-last:right;color:var(--ink-2);padding-right:2px;cursor:pointer}
.mini-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink-2);flex:none}
.mini-x svg{width:14px;height:14px}
.add-row{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:22px;border:1.5px dashed var(--ink-3);color:var(--ink);font-weight:500;font-size:15.5px}
.add-row svg{width:18px;height:18px}
.preview{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:22px;background:var(--fill);font-size:14.5px}
.pv-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pv-big b{font-size:28px;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.pv-line{display:flex;gap:8px;align-items:flex-start}
.pv-line svg{width:17px;height:17px;margin-top:1px}
.pv-line.over{color:var(--red-ink);font-weight:500}
.pv-line.near{color:var(--amber-ink);font-weight:500}
.pv-line.ok{color:var(--green-ink);font-weight:500}
.pv-line .yen{font-weight:600;color:var(--ink)}
.err{color:var(--red-ink);font-size:14.5px;font-weight:500;padding-inline:4px}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill-2);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 3px 8px rgb(0 0 0 / .15),0 1px 1px rgb(0 0 0 / .16);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.switch:checked{background:var(--pri)}
.switch:checked::after{transform:translateX(20px);background:var(--on-pri)}

/* ---------- action sheet + toast ---------- */
.as{position:fixed;inset:0;z-index:75;display:flex;align-items:flex-end;justify-content:center}
.as-bg{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease}
.as-panel{position:relative;display:flex;flex-direction:column;gap:8px;width:100%;max-width:30rem;padding:8px 10px calc(12px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1)}
.as-group{background:var(--card);border-radius:24px;overflow:hidden}
.as-head{padding:16px 20px;text-align:center;font-size:13.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.as-head b{display:block;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px}
.as-btn{display:block;width:100%;min-height:58px;font-size:17px;font-weight:500;color:var(--ink);text-align:center}
.as-btn + .as-btn{border-top:1px solid var(--line)}
.as-btn.danger{color:var(--red-ink)}
.as-btn.cancel{border-radius:999px;background:var(--pri);color:var(--on-pri);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-gap) + 86px);z-index:80;display:flex;align-items:center;gap:16px;
  max-width:min(28rem,calc(100% - 32px));padding:12px 14px 12px 20px;border-radius:999px;background:var(--pri);color:var(--on-pri);font-size:14.5px;font-weight:500;
  opacity:0;transform:translate(-50%,14px);pointer-events:none;transition:opacity .2s,transform .25s;box-shadow:0 14px 34px rgb(0 0 0 / .25)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.toast.bad{background:var(--red);color:#FFFFFF}

@keyframes up{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.days{gap:4px}.day b{font-size:17px}.tiles{gap:8px}.tile{padding:12px 10px}.tile b{font-size:18px}.head h1{font-size:25px}}
</style>
</head>
<body>
<div id="view"></div>

<div class="tabfade" aria-hidden="true"></div>
<nav class="tabbar" aria-label="Điều hướng">
  <button class="tab" data-tab="week" id="tab-week" aria-label="Trang chủ"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z"/></svg></span><span class="tl">Trang chủ</span></button>
  <button class="tab" data-tab="month" id="tab-month" aria-label="Lịch làm"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.5 10h7M8.5 14h4.5"/></svg></span><span class="tl">Lịch làm</span></button>
  <button class="tab" data-tab="shops" id="tab-shops" aria-label="Quán"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11v8.5h15V11"/><path d="M3 8.5L5 4.5h14l2 4a2.5 2.5 0 0 1-4.5 1.5 2.5 2.5 0 0 1-4.5 0 2.5 2.5 0 0 1-4.5 0A2.5 2.5 0 0 1 3 8.5z"/></svg></span><span class="tl">Quán</span></button>
  <button class="tab" data-tab="settings" id="tab-settings" aria-label="Cài đặt"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2.6"/><circle cx="17" cy="7" r="2.6"/><circle cx="7" cy="17" r="2.6"/><circle cx="17" cy="17" r="2.6"/></svg></span><span class="tl">Cài đặt</span></button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-act="close"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true"><div class="grabber"></div><div id="sheet-body"></div></div>
</div>
<div class="as" id="as" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* ---------- limits ---------- */
const weekStartOf = (s) => addDays(s, -((dowOf(s) - settings().weekStart + 7) % 7));

function weekLimitMin(start) { // a 7-day window counts as vacation only when every day is inside a vacation period
  const st = settings();

  return st.vacWeekLimit * 60;
}
const perDayMin = (d) => ((isVac(d) ? settings().vacWeekLimit : settings().weekLimit) * 60) / 7; // weekly limit spread over 7 days, for the monthly projection
const sumRange = (day, start, n) => { let s = 0; for (let i = 0; i < n; i++) s += day[addDays(start, i)] || 0; return s; };

function availableOn(d, day = idx.day) { // hours left in the calendar week (starting on the chosen first weekday) that contains d
  const ws = weekStartOf(d);
  return Math.max(0, weekLimitMin(ws) - sumRange(day, ws, 7));
}
function weekStats(ws) {
  const t = todayStr(); let total = 0, done = 0;
  for (let i = 0; i < 7; i++) { const d = addDays(ws, i), v = idx.day[d] || 0; total += v; if (d < t) done += v; }
  const limit = weekLimitMin(ws);
  return { ws, we: addDays(ws, 6), total, done, plan: total - done, limit, status: statusOf(total, limit) };
}
function weekShifts(ws) { const out = []; for (let i = 0; i < 7; i++) out.push(...(idx.byDate[addDays(ws, i)] || [])); return out; }

  const lim = weekLimitMin(ws), set = new Set(); let run = 0;
  for (const s of weekShifts(ws)) { run += shiftMin(s); if (run > lim) set.add(s.id); }
  return set;
}
const isVacWeek = (ws) => { for (let i = 0; i < 7; i++) if (isVac(addDays(ws, i))) return true; return false; };

function monthStats(ym) {
  const t = todayStr(), n = daysInMonth(ym), first = `${ym}-01`, last = `${ym}-${pad(n)}`;
  let total = 0, done = 0, cap = 0, daysLeft = 0;
  for (let i = 0; i < n; i++) {

    total += v; if (d < t) done += v; else daysLeft++;

  const weeks = [];
  for (let ws = weekStartOf(first); ws <= last; ws = addDays(ws, 7)) weeks.push(weekStats(ws));
  return { ym, n, first, last, total, done, plan: total - done, cap, daysLeft, weeks, status: statusOf(total, cap) };

/* ---------- Japanese public holidays (祝日), computed per year ---------- */
const HOLIDAYS = {};
function jpHolidays(y) {
  const H = {};
  const add = (m, d, name) => { H[`${y}-${pad(m)}-${pad(d)}`] = name; };
  const nthMonday = (m, n) => 1 + ((8 - new Date(y, m - 1, 1).getDay()) % 7) + (n - 1) * 7;
  const equinox = (base) => Math.floor(base + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  add(1, 1, '元日'); add(1, nthMonday(1, 2), '成人の日'); add(2, 11, '建国記念の日'); add(2, 23, '天皇誕生日');
  add(3, equinox(20.8431), '春分の日'); add(4, 29, '昭和の日'); add(5, 3, '憲法記念日'); add(5, 4, 'みどりの日'); add(5, 5, 'こどもの日');
  add(7, nthMonday(7, 3), '海の日'); add(8, 11, '山の日'); add(9, nthMonday(9, 3), '敬老の日'); add(9, equinox(23.2488), '秋分の日');
  add(10, nthMonday(10, 2), 'スポーツの日'); add(11, 3, '文化の日'); add(11, 23, '勤労感謝の日');
  for (const k of Object.keys(H)) { const mid = addDays(k, 1); if (H[addDays(k, 2)] && !H[mid]) H[mid] = '国民の休日'; }
  for (const k of Object.keys(H).sort()) if (dowOf(k) === 0) { let d = addDays(k, 1); while (H[d]) d = addDays(d, 1); H[d] = '振替休日'; }
  return H;
}
const holidayName = (d) => { const y = Number(d.slice(0, 4)); return (HOLIDAYS[y] || (HOLIDAYS[y] = jpHolidays(y)))[d] || ''; };

/* ---------- pay: wage by day type, night premium, transport ---------- */

  const wd = Number(shop.wage) || 0, wkd = Number(shop.wageWeekend) || wd, hol = Number(shop.wageHoliday) || wkd;
  return kind === 'hol' ? hol : kind === 'wkd' ? wkd : wd;

  const a = toMin(W(s).start), b = a + grossMin(s);

}

/* ---------- storage: everything stays on this device (localStorage) ---------- */
function loadLocal() {
  try { const o = JSON.parse(localStorage.getItem(LS_DATA) || 'null'); if (o && o.docs) docs = o.docs; } catch (e) {}
  let u = {};
  try { u = JSON.parse(localStorage.getItem(LS_UI) || '{}') || {}; if (TABS.includes(u.tab)) ui.tab = u.tab; } catch (e) {}
  // no saved choice: keep Vietnamese for data made before languages existed, otherwise follow the browser
  ui.lang = LANGS.includes(u.lang) ? u.lang : Object.keys(docs).length ? 'vi' : detectLang();
  setLang(ui.lang);
}
function saveLocal() {
  try { localStorage.setItem(LS_DATA, JSON.stringify({ docs })); }
  catch (e) { toast(T('saveFail'), 'bad'); }
}
function saveUI() { try { localStorage.setItem(LS_UI, JSON.stringify({ tab: ui.tab, lang: ui.lang })); } catch (e) {} }

function commit(keys) {
  for (const k of new Set(keys)) if (k.startsWith('m-') && docs[k] && !(docs[k].shifts || []).length) delete docs[k];
  _st = null;
  saveLocal();
  render();
}

/* ---------- mutations ---------- */
function putShift(shift, keys) {
  const old = allShifts().find((s) => s.id === shift.id);
  if (old) { const k = mkey(old.date); docs[k].shifts = docs[k].shifts.filter((s) => s.id !== shift.id); keys.push(k); }
  const k = mkey(shift.date);
  if (!docs[k]) docs[k] = { shifts: [] };
  docs[k].shifts.push(shift); keys.push(k);
}
function dropShifts(pred, keys) {
  for (const k of Object.keys(docs)) if (k.startsWith('m-')) {
    const before = docs[k].shifts || [], after = before.filter((s) => !pred(s));
    if (after.length !== before.length) { docs[k].shifts = after; keys.push(k); }
  }
}
function makeShop(name, extra = {}) {
  const used = new Set(shops().map((s) => s.color));
  const color = SHOP_COLORS.find((c) => !used.has(c)) || SHOP_COLORS[shops().length % SHOP_COLORS.length];
  return { id: newId(), name, wage: 0, color, address: '', phone: '', note: '', presets: [], ...extra };
}
function setSetting(patch) { Object.assign(ensureConfig().settings, patch); _st = null; commit(['config']); }

function updatePreview() {

  const net = planMin(form), gross = grossMin(plan(form));

function saveShift() {
  const err = shiftErr();
  if (err) return showErr('#sh-err', err);
  const keys = [];
  const shift = { id: form.id || newId(), shopId: form.shopId, date: form.date, start: form.start, end: form.end, breakMin: form.breakMin, note: form.note.trim() };
  if (form.sample) shift.sample = true;
  if (form.actual) shift.actual = { start: form.actual.start, end: form.actual.end, breakMin: Math.max(0, Math.round(Number(form.actual.breakMin) || 0)), ...(form.actual.auto ? { auto: true } : {}) };
  if (form.punch) { // keep a running clock; a punch made from Home while this sheet was open wins
    const cur = allShifts().find((s) => s.id === form.id);
    if (cur && punchState(cur)) shift.punch = clone(cur.punch);
    else if (cur && hasActual(cur)) shift.actual = clone(cur.actual);
  }
  putShift(shift, keys);
  closeSheet();
  if (ui.tab === 'month') ui.ym = shift.date.slice(0, 7); else { ui.tab = 'week'; ui.ws = weekStartOf(shift.date); saveUI(); }
  commit(keys);
  const w = weekStats(weekStartOf(shift.date));
  if (w.status === 'over') toast(T('savedOver', fmtDM(w.ws), fmtH(w.total - w.limit)), 'bad');
  else toast(T('savedOk', fmtH(shiftMin(shift)), fmtH(w.total), fmtH(w.limit)));
}
function punchShift(id, kind) {
  const cur = allShifts().find((x) => x.id === id);
  if (!cur) return;
  const before = clone(cur), s = clone(cur), now = Date.now(), st = punchState(s);
  let msg = '', bad = false;
  if (kind === 'in') {
    if (st) return;
    const other = allShifts().find((x) => x.id !== id && punchState(x));
    if (other && Date.now() > planEndTs(other)) { sweepForgotten(other.id); return punchShift(id, kind); }
    if (other) { toast(T('inOther', shopName(other.shopId)), 'bad'); return; }
    s.punch = { in: now, breaks: [] }; delete s.actual;
    msg = T('inAtT', hmOf(now));
  } else if (!st) return;
  else if (kind === 'brk') {
    if (st === 'break') return;
    s.punch.breaks.push({ s: now });
    msg = T('brkAt', hmOf(now));
  } else if (kind === 'brk-end') {
    if (st !== 'break') return;
    const b = s.punch.breaks[s.punch.breaks.length - 1]; b.e = now;
    msg = T('brkDone', Math.max(0, minOf(now) - minOf(b.s)));
  } else if (kind === 'out') {
    const b = s.punch.breaks[s.punch.breaks.length - 1];
    if (b && !Number.isFinite(b.e)) b.e = now;
    const tl = punchTally(s.punch, now);
    if (tl.gross < 1) { toast(T('tooSoon'), 'bad'); return; }
    s.actual = { start: hmOf(s.punch.in), end: hmOf(now), breakMin: tl.brk };
    delete s.punch;
    const d = shiftMin(s) - planMin(s);
    msg = T('outDone', fmtH(shiftMin(s))) + (d ? ` (${T('vsPlan', d > 0, fmtShort(d))})` : '');
  } else if (kind === 'cancel') {
    delete s.punch; msg = T('cancelled');
  } else return;
  const keys = [];
  putShift(s, keys);
  if (!$('#sheet').hidden) closeSheet();
  if (ui.tab !== 'week') { ui.tab = 'week'; saveUI(); }
  ui.ws = weekStartOf(s.date);
  commit(keys);
  if (kind === 'out') {
    const w = weekStats(weekStartOf(s.date));
    if (w.status === 'over') { msg += T('weekOverX', fmtH(w.total - w.limit)); bad = true; }
  }
  toast(msg, bad ? 'bad' : '', { label: T('undo'), fn: () => { const k = []; putShift(before, k); commit(k); toast(T('undone')); } });
}
function deleteShift(id) {
  const s = allShifts().find((x) => x.id === id);
  if (!s) return;
  const keys = [];
  dropShifts((x) => x.id === id, keys);
  closeSheet(); commit(keys);
  toast(T('shiftDeleted'), '', { label: T('undo'), fn: () => { const k = []; putShift(s, k); commit(k); toast(T('shiftRestored')); } });
}

function saveShop() {
  const f = shopForm;
  const name = f.name.trim();
  if (!name) return showErr('#shop-err', T('e_name'));
  const presets = [];
  for (const p of f.presets) {
    const pname = String(p.name || '').trim();
    if (!p.start && !p.end && !pname) continue;
    if (!isTime(p.start) || !isTime(p.end)) return showErr('#shop-err', T('e_pTimes', pname || T('unnamed')));
    if (p.start === p.end) return showErr('#shop-err', T('e_pSame', pname || p.start));
    const breakMin = Math.max(0, Math.round(Number(p.breakMin) || 0));
    if (shiftMin({ start: p.start, end: p.end, breakMin }) <= 0) return showErr('#shop-err', T('e_pBrk', pname || p.start));
    presets.push({ id: p.id || newId(), name: pname, start: p.start, end: p.end, breakMin });
  }
  const yenNum = (v) => Math.max(0, Math.round(Number(v) || 0));
  const data = { name, wage: yenNum(f.wage), wageWeekend: yenNum(f.wageWeekend), wageHoliday: yenNum(f.wageHoliday),
    nightPct: f.nightPct === '' ? 25 : clamp(Math.round(Number(f.nightPct) || 0), 0, 100), transport: yenNum(f.transport),
    closeDay: Number(f.closeDay) || 0, payDay: clamp(Math.round(Number(f.payDay) || 0), 0, 31), payMonth: f.payMonth === '0' ? 0 : 1,
    phone: f.phone.trim(), address: f.address.trim(), note: f.note.trim(), color: f.color, presets };
  const cfg = ensureConfig();
  let id = f.id;
  if (id) Object.assign(cfg.shops.find((x) => x.id === id), data);
  else { const s = { ...makeShop(name), ...data }; cfg.shops.push(s); id = s.id; }
  const ret = f.returnForm;
  if (ret) {
    shopForm = null; commit(['config']);
    form = { ...ret, shopId: id };
    if (!form.id) applyShopDefaults();
    openSheet(shiftSheetHTML()); updatePreview();
  } else { closeSheet(); commit(['config']); }
  toast(T('shopSaved', presets.length));
}

async function exportData() {
  const payload = { app: 'arubaito', version: 1, exportedAt: new Date().toISOString(), config: docs.config || { shops: [], settings: {} }, shifts: allShifts() };
  const text = JSON.stringify(payload, null, 2), name = `arubaito-${todayStr()}.json`;
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    let dl = null; try { dl = await c.use('downloads'); } catch (e) {}
    if (dl) {
      try { await dl.save({ filename: name, data: text }); toast(T('exported')); }
      catch (e) { if (!e || e.code !== 'declined') toast(T('exportFail'), 'bad'); }
      return;
    }
  }
  try {
    const file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function importData(text) {

  if (!o || o.app !== 'arubaito' || !o.config || !Array.isArray(o.shifts)) { toast(T('notBackup'), 'bad'); return; }
  const shifts = o.shifts.filter(okShift);
  askConfirm({ title: T('importQ'), text: T('importText', shifts.length, (o.config.shops || []).length), ok: T('replace'), onOk: () => {
    const keys = Object.keys(docs);
    docs = { config: { shops: Array.isArray(o.config.shops) ? o.config.shops : [], settings: o.config.settings || {} } };
    for (const s of shifts) {
      const k = mkey(s.date), a = s.actual, p = s.punch;
      const extra = {};
      if (s.sample) extra.sample = true;
      if (a && isTime(a.start) && isTime(a.end)) extra.actual = { start: a.start, end: a.end, breakMin: Math.max(0, Number(a.breakMin) || 0), ...(a.auto ? { auto: true } : {}) };
      else if (p && Number.isFinite(p.in)) extra.punch = { in: p.in, breaks: (Array.isArray(p.breaks) ? p.breaks : []).filter((b) => b && Number.isFinite(b.s)).map((b) => (Number.isFinite(b.e) ? { s: b.s, e: b.e } : { s: b.s })) };
      (docs[k] || (docs[k] = { shifts: [] })).shifts.push({ id: s.id, shopId: s.shopId, date: s.date, start: s.start, end: s.end, breakMin: Number(s.breakMin) || 0, note: String(s.note || '').slice(0, 200), ...extra });
    }
    _st = null; ui.ws = weekStartOf(todayStr());
    commit([...keys, ...Object.keys(docs)]); toast(T('imported', shifts.length));
  } });
}

  'sh-editshop': () => { const ret = { ...form }; form = null; openShop(ret.shopId, ret); },
  'sh-break': (el) => { form.breakMin = Number(el.dataset.v); $('#sh-break').innerHTML = breakSeg(); $('#sh-presets').innerHTML = presetChips(); updatePreview(); },
  'sh-quick': (el) => { form.date = el.dataset.v === '+7' ? addDays(isDate(form.date) ? form.date : todayStr(), 7) : el.dataset.v; $('#sh-date').value = form.date; updatePreview(); },
  'sh-save': () => saveShift(),
  'sh-del': () => { const id = form.id; actionSheet({ title: T('delShiftQ'), message: T('delShiftMsg'), actions: [{ label: T('delShift'), danger: true, fn: () => deleteShift(id) }] }); },
  'sh-dup': () => {
    const src = allShifts().find((s) => s.id === form.id); if (!src) return;
    const copy = { ...src, id: newId(), date: addDays(src.date, 7) }; delete copy.sample; delete copy.actual; delete copy.punch;
    const keys = []; putShift(copy, keys); closeSheet();
    if (ui.tab === 'week') ui.ws = weekStartOf(copy.date);
    commit(keys); toast(T('copied', longDay(copy.date)));
  },

  'shop-new': () => openShop(null),
  'shop-edit': (el) => openShop(el.dataset.id),
  'shop-color': (el) => {
    shopForm.color = el.dataset.v;
    document.querySelectorAll('.swatch').forEach((s) => s.classList.toggle('on', s.dataset.v === shopForm.color));
    $('#shop-avatar').style.setProperty('--c', shopForm.color);
  },
  'shop-save': () => saveShop(),
  'shop-del': () => {
    const n = allShifts().filter((s) => s.shopId === shopForm.id).length;
    actionSheet({ title: T('delShopQ', shopForm.name), message: n ? T('delShopN', n) : T('delShop0'), actions: [{ label: T('delShop'), danger: true, fn: deleteShop }] });
  },
  'shop-back': () => { const ret = shopForm.returnForm; shopForm = null; form = ret; openSheet(shiftSheetHTML()); updatePreview(); },
  'pr-add': () => { shopForm.presets.push(blankPreset()); $('#shop-presets').innerHTML = presetEditors(); const ins = document.querySelectorAll('#shop-presets .in-l'); ins[ins.length - 1].focus(); },
  'pr-rm': (el) => { shopForm.presets.splice(Number(el.dataset.pi), 1); $('#shop-presets').innerHTML = presetEditors(); },

  'vac-new': () => openVac(null),
  'vac-edit': (el) => openVac(el.dataset.id),
  'vac-save': () => saveVac(),
  'vac-del': () => { const id = vacForm.id; closeSheet(); setSetting({ vacations: settings().vacations.filter((v) => v.id !== id) }); toast(T('vacDeleted')); },

  'set-ws': (el) => { setSetting({ weekStart: Number(el.dataset.v) }); ui.ws = weekStartOf(ui.ws); render(); },
  export: () => exportData(),
  import: () => { const f = $('#import-file'); f.value = ''; f.click(); },
  'sample-load': () => loadSample(),
  'sample-clear': () => clearSample(),
  'clear-all': () => askConfirm({ title: T('clearAllQ'), text: T('clearAllText', allShifts().length, shops().length), ok: T('deleteAll'), onOk: clearAll }),
};
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; saveUI(); render(); scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  if (el.classList.contains('shift')) { // a tap right after a swipe, or on an opened row, only settles the row
    if (el.dataset.swiped) return;
    if (el.closest('.swipe').classList.contains('open')) { closeSwipes(); return; }
  }
  e.preventDefault();
  ACT[el.dataset.act](el);
});

/* swipe left on a shift card to reveal Xoá, like iOS lists */
const OPEN = 96;
let drag = null;
function closeSwipes(except) {
  document.querySelectorAll('.swipe.open, .swipe.reveal').forEach((w) => {
    if (w === except) return;
    w.classList.remove('open'); $('.shift', w).style.transform = '';
    setTimeout(() => { if (!w.classList.contains('open')) w.classList.remove('reveal'); }, 300);
  });
}
document.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.swipe-del')) return;
  const card = e.target.closest('.swipe .shift'), wrap = card && card.closest('.swipe');
  closeSwipes(wrap);
  if (!card || (e.pointerType === 'mouse' && e.button !== 0)) return;
  drag = { card, wrap, x0: e.clientX, y0: e.clientY, base: wrap.classList.contains('open') ? -OPEN : 0, dx: 0, on: false };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.on) {
    if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    if (Math.abs(dx) < 8) return;
    drag.on = true; drag.wrap.classList.add('reveal'); drag.card.style.transition = 'none';
  }
  drag.dx = dx;
  drag.card.style.transform = `translateX(${clamp(drag.base + dx, -OPEN - 36, 0)}px)`;
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.on) return;
  d.card.style.transition = '';
  const open = d.base + d.dx < -OPEN / 2;
  d.wrap.classList.toggle('open', open);
  d.card.style.transform = open ? `translateX(${-OPEN}px)` : '';
  if (!open) setTimeout(() => { if (!d.wrap.classList.contains('open')) d.wrap.classList.remove('reveal'); }, 300);
  d.card.dataset.swiped = '1';
  setTimeout(() => { delete d.card.dataset.swiped; }, 80);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

document.addEventListener('input', (e) => {
  const el = e.target, id = el.id;
  if (shopForm) {
    const field = { 'shop-name': 'name', 'shop-wage': 'wage', 'shop-wage-wkd': 'wageWeekend', 'shop-wage-hol': 'wageHoliday', 'shop-night': 'nightPct', 'shop-transport': 'transport',
      'shop-close': 'closeDay', 'shop-payday': 'payDay', 'shop-paymonth': 'payMonth', 'shop-phone': 'phone', 'shop-address': 'address', 'shop-note': 'note' }[id];
    if (field) shopForm[field] = el.value;
    if (id === 'shop-name') $('#shop-avatar').textContent = initial(el.value);
    const row = el.closest('.preset-ed');
    if (row && el.dataset.pf) shopForm.presets[Number(row.dataset.pi)][el.dataset.pf] = el.value;
    return;
  }
  if (!form) return;
  if (id === 'sh-date') form.date = el.value;
  else if (id === 'sh-start') form.start = el.value;
  else if (id === 'sh-end') form.end = el.value;
  else if (id === 'sh-note') { form.note = el.value; return; }
  else if (form.actual && (id === 'sh-astart' || id === 'sh-aend' || id === 'sh-abreak')) {
    delete form.actual.auto;
    if (id === 'sh-astart') form.actual.start = el.value;
    else if (id === 'sh-aend') form.actual.end = el.value;
    else form.actual.breakMin = Math.max(0, Math.round(Number(el.value) || 0));
    $('#sh-err').hidden = true; updatePreview(); return;
  }
  else return;
  $('#sh-err').hidden = true;
  if (id === 'sh-date' && !form.actual && !form.punch) $('#sh-actual').innerHTML = actualSect();
  if (id !== 'sh-date') $('#sh-presets').innerHTML = presetChips();
  updatePreview();
});
document.addEventListener('change', (e) => {
  const el = e.target, id = el.id;
  const num = (lo, hi) => { const v = Number(el.value); return Number.isFinite(v) && v > 0 ? clamp(Math.round(v * 2) / 2, lo, hi) : null; };
  if (id === 'set-week') { const v = num(1, 80); if (v) setSetting({ weekLimit: v }); else render(); }
  else if (id === 'set-vweek') { const v = num(1, 80); if (v) setSetting({ vacWeekLimit: v }); else render(); }
  else if (id === 'set-lang') { ui.lang = el.value; setLang(ui.lang); saveUI(); render(); }
  else if (id === 'import-file' && el.files && el.files[0]) { const r = new FileReader(); r.onload = () => importData(String(r.result || '')); r.readAsText(el.files[0]); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('#as').hidden) closeAS(); else if (!$('#sheet').hidden) closeSheet(); }
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !$('#sheet').hidden) { const btn = $('#sheet-body .sheet-cta'); if (btn) { e.preventDefault(); btn.click(); } }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#sheet').hidden && !sweepForgotten()) render(); });
let tick = 0; // every 15 s while clocked in (live timer), every minute otherwise
setInterval(() => {
  tick++;
  if (document.hidden || !$('#sheet').hidden || !$('#as').hidden || ui.tab !== 'week' || document.querySelector('.swipe.open')) return;
  if (tick % 4 === 0 || allShifts().some((s) => punchState(s))) { if (!sweepForgotten()) render(); }
}, 15000);

/* ---------- boot ---------- */
loadLocal();
render();
sweepForgotten();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
